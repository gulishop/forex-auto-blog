name: Daily Auto Post

on:
  schedule:
    - cron: "0 5 * * *"   # 10:00 AM Pakistan Time (PKT = UTC+5)
    - cron: "0 9 * * *"   # 2:00 PM Pakistan Time
    - cron: "0 12 * * *"  # 5:00 PM Pakistan Time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: Naya post generate karo (Facebook + Telegram + WhatsApp)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID_FKC: ${{ secrets.FB_PAGE_ID_FKC }}
          FB_PAGE_TOKEN_FKC: ${{ secrets.FB_PAGE_TOKEN_FKC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
        run: python generate_post.py

      - name: Changes commit aur push karo
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto post: $(date +'%d-%m-%Y %H:%M')" || echo "Kuch naya nahi hai"
          git pull --rebase
          git push
