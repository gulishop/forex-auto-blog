name: Auto Generate Trading Post

on:
  schedule:
    # Har ghante chalega (UTC time ke hisaab se)
    - cron: '0 * * * *'
  workflow_dispatch: {}   # manually bhi "Run workflow" button se chala sakte ho

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies install karo
        run: pip install google-generativeai

      - name: Post generate karo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
        run: python generate_post.py

      - name: Naya post commit aur push karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html posts.json
          git diff --staged --quiet || git commit -m "Auto: naya post add kiya"
          git push
